[project]
name = "crux"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "packaging==26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]     # only for crux.resolver.ablation's figures

# `pip install -e .` puts a `crux` command on PATH that calls crux.cli.main
[project.scripts]
crux = "crux.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Explicit package list. Without this, setuptools' flat-layout autodiscovery
# also finds the top-level `data/` and `snapshots/` directories and refuses to
# build, so `pip install -e .` fails and the solver team cannot import crux
# from outside the repository root.
[tool.setuptools]
packages = ["crux", "crux.data", "crux.resolver", "crux.explain", "crux.benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# the user study's form template ships next to crux/benchmark/study.py
[tool.setuptools.package-data]
"crux.benchmark" = ["study_form.html"]
